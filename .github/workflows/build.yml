name: Build Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Providers
        run: ./gradlew :TorrServe:make :ExternalPlayers:make :SkipTorrentWarning:make :PopupBlocker:make :H2RxDMovies:make :AllInOneLiveTV:make :MoviesDrive:make :SystemFont:make

      - name: Generate repo.json and plugins.json
        run: |
          mkdir -p builds

          echo '{
            "name": "cloudstream-plugins",
            "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/extension/materialicons/48dp/2x/baseline_extension_white_48dp.png",
            "description": "Cloudstream Plugins & Tools Repository",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/plugins.json?v=2"
            ]
          }' > builds/repo.json

          echo '[
            {
              "name": "TorrServe",
              "internalName": "TorrServe",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/TorrServe.cs3?v=6",
              "tvTypes": ["Torrent", "Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/YouROK/TorrServer/master/server/web/public/favicon.ico",
              "apiVersion": 10,
              "version": 6,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "TorrServer BitTorrent streaming engine with active keep-alive, 40+ high-speed trackers, buffer tuner & seeding controls"
            },
            {
              "name": "External Players",
              "internalName": "ExternalPlayers",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/ExternalPlayers.cs3?v=4",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/av/play_circle_filled/materialicons/48dp/2x/baseline_play_circle_filled_white_48dp.png",
              "apiVersion": 10,
              "version": 4,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "External video players integration"
            },
            {
              "name": "Skip Torrent Warning",
              "internalName": "SkipTorrentWarning",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/SkipTorrentWarning.cs3?v=3",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/visibility_off/materialicons/48dp/2x/baseline_visibility_off_white_48dp.png",
              "apiVersion": 10,
              "version": 3,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Bypasses '\''Stream Torrent'\'' confirmation dialog and shows stream stats in player controls"
            },
            {
              "name": "Popup Blocker",
              "internalName": "PopupBlocker",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/PopupBlocker.cs3?v=3",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/shield/materialicons/48dp/2x/baseline_shield_white_48dp.png",
              "apiVersion": 10,
              "version": 3,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Universal shield that suppresses and blocks donation popups, announcement modals, and support dialogs across all CloudStream extensions (AllForU, CNCVerse, Raghav, Phisher Repo, etc.)"
            },
            {
              "name": "H2RxDMovies",
              "internalName": "H2RxDMovies",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/H2RxDMovies.cs3?v=4",
              "tvTypes": ["Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://h2r-xdmovies.pages.dev/favicon.svg",
              "apiVersion": 10,
              "version": 4,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Stream movies & TV series from H2RxDMovies (HubCloud direct R2 & Google CDN streams)"
            },
            {
              "name": "Allinone Live TV",
              "internalName": "AllInOneLiveTV",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/AllInOneLiveTV.cs3?v=1",
              "tvTypes": ["Live"],
              "language": "en",
              "iconUrl": "https://widespread-plum-gffbkraoo7-deis8y3f44.edgeone.dev/channels4_profile.jpg",
              "apiVersion": 10,
              "version": 1,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Live TV & Sports channels from Allinone Live TV (JioTV Plus, SonyLiv, Sports TV, Fancode)"
            },
            {
              "name": "MoviesDrive",
              "internalName": "MoviesDrive",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/MoviesDrive.cs3?v=4",
              "tvTypes": ["Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://new3.moviesdrive.cyou/wp-content/uploads/2026/01/log.png",
              "apiVersion": 10,
              "version": 4,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Stream movies & TV series from MoviesDrive with customizable category catalogue & HubCloud extraction"
            },
            {
              "name": "System Font",
              "internalName": "SystemFont",
              "url": "https://raw.githubusercontent.com/deep12323/cloudstream-plugins/builds/SystemFont.cs3?v=13",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/editor/text_fields/materialicons/48dp/2x/baseline_text_fields_white_48dp.png",
              "apiVersion": 13,
              "version": 13,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Forces CloudStream to adopt your device'\''s native system font instead of hardcoded Google Sans across all UI elements"
            }
          ]' > builds/plugins.json

      - name: Push to builds branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin
          git checkout -B builds
          git rm -rf .github/ || true
          cp -r builds/. .
          git add -f repo.json plugins.json *.cs3 || true
          git status
          git commit -m "Update builds" || true
          git push origin builds --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudstreamPlugins
          path: builds/
